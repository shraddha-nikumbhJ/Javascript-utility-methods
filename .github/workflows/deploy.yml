name: CI Pipeline

on:
  push:
    branches:
      - vite-app

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Downloading Project Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --watch=false

      - name: Build Application
        run: npm run build
